name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - name: Build app and create release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Shiny Hunt Counter v__VERSION__
          releaseBody: "Descarrega o ShinyHuntCounter-portable.exe para abrir logo, sem instalar, ou o setup.exe para instalar com atalho no menu Iniciar."
          releaseDraft: false
          prerelease: false

      - name: Attach portable exe to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/shiny-hunt-counter.exe ShinyHuntCounter-portable.exe
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" ShinyHuntCounter-portable.exe --clobber

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinyHuntCounter-windows
          path: |
            ShinyHuntCounter-portable.exe
            src-tauri/target/release/bundle/nsis/*.exe
