<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shiny Hunt Counter — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F8; --panel:#FFFFFF; --raised:#E3E6F3; --line:rgba(40,50,110,.14);
  --ink:#1A1F3A; --muted:#5B6288; --accent:#3F5FE8; --accent-ink:#FFFFFF;
  --gold:#C8901A; --danger:#D6334A; --ok:#1E9E72; --glow:rgba(63,95,232,.10);
  --screen:#161B36; --screen-ink:#F2F4FF; --screen-muted:#9AA2D0;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --shiny:linear-gradient(120deg,#F4C24E,#FFE7A3 30%,#7FE3C4 55%,#B79CFF 80%,#F4C24E);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A2F; --panel:#1C2340; --raised:#273057; --line:rgba(160,172,235,.13);
    --ink:#EDEFFA; --muted:#98A0C8; --accent:#6C8BFF; --accent-ink:#0C1233;
    --gold:#F4C24E; --danger:#FF6B7A; --ok:#4FD6A4; --glow:rgba(108,139,255,.13);
    --screen:#0D1127;
  }
}
:root[data-theme="dark"]{
  --bg:#141A2F; --panel:#1C2340; --raised:#273057; --line:rgba(160,172,235,.13);
  --ink:#EDEFFA; --muted:#98A0C8; --accent:#6C8BFF; --accent-ink:#0C1233;
  --gold:#F4C24E; --danger:#FF6B7A; --ok:#4FD6A4; --glow:rgba(108,139,255,.13);
  --screen:#0D1127;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 var(--body);
  background:radial-gradient(1100px 520px at 15% -12%,var(--glow),transparent 62%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;font-weight:700}
h2{font-size:22px} h3{font-size:16px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
img{max-width:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:18px;
  padding:10px 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;background:none;border:0;cursor:pointer;padding:4px}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
nav.main{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.main button{background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
nav.main button:hover{color:var(--ink)}
nav.main button.on{color:var(--ink);background:var(--raised)}
.totals{margin-left:auto;display:flex;align-items:center;gap:18px;white-space:nowrap;flex:none}
.tot b{display:block;font:700 16px var(--display);font-variant-numeric:tabular-nums}
.tot span{font-size:11.5px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600}
.profile i{width:26px;height:26px;border-radius:50%;background:var(--shiny);display:block}
.saved{font-size:12px;color:var(--muted)}
main{max-width:1380px;margin:0 auto;padding:26px 22px 90px}
@media (max-width:1520px){.tot.hide-sm{display:none}}
@media (max-width:760px){.top{flex-wrap:wrap;gap:8px 12px}.totals{margin-left:0;order:3;width:100%;justify-content:space-between}nav.main{order:2;width:100%}}

/* buttons */
.btn{display:inline-flex;white-space:nowrap;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);
  padding:9px 15px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s}
.btn:hover{background:color-mix(in srgb,var(--raised) 85%,var(--ink) 10%)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.gold{background:var(--shiny);background-size:200% 100%;color:#2B1C00;border-color:transparent;animation:sheen 6s linear infinite}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
@keyframes sheen{to{background-position:200% 0}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--raised);color:var(--muted)}
.pill.active{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.pill.paused{color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.pill.completed{color:#2B1C00;background:var(--shiny)}
.pill.abandoned{color:var(--muted)}
.type{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:color-mix(in srgb,var(--tc) 22%,transparent);color:color-mix(in srgb,var(--tc) 65%,var(--ink))}
.kbd{display:inline-block;font:600 12px var(--display);padding:2px 7px;border-radius:6px;border:1px solid currentColor;opacity:.8}

/* orb placeholder art */
.orb{--s:64px;width:var(--s);height:var(--s);flex:none;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c1) 50%,#fff),var(--c1) 46%,color-mix(in srgb,var(--c2) 72%,#000) 100%);
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.28),0 8px 18px -8px var(--c1)}
.orb::after{content:"";position:absolute;inset:17%;border-radius:50%;border:2px solid rgba(255,255,255,.32)}
.orb span{font:700 calc(var(--s)*.25) var(--display);color:rgba(255,255,255,.92);letter-spacing:.02em;position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.orb.shiny{background:conic-gradient(from 210deg,#F4C24E,#FFE9A8,#7FE3C4,#B79CFF,#F4C24E);box-shadow:inset 0 -6px 14px rgba(0,0,0,.18),0 0 26px -4px rgba(244,194,78,.7)}
.orb.shiny span{color:#3A2700;text-shadow:none}
.spk{position:absolute;width:12px;height:12px;background:#fff;z-index:2;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:tw 1.9s ease-in-out infinite}
.spk.a{top:2%;right:8%}.spk.b{bottom:10%;left:0;width:9px;height:9px;animation-delay:.6s}.spk.c{top:30%;left:-6%;width:7px;height:7px;animation-delay:1.2s}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.orb.reveal{animation:reveal .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes reveal{0%{transform:scale(.6) rotate(-30deg);filter:brightness(3)}60%{transform:scale(1.12)}100%{transform:none;filter:none}}

/* home */
.home-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
@media (max-width:900px){.home-top{grid-template-columns:1fr}}
.newhunt{display:flex;flex-direction:column;justify-content:space-between;gap:28px;text-align:left;cursor:pointer;border:0;border-radius:22px;padding:26px;min-height:210px;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .1s,box-shadow .1s}
.newhunt:active{transform:translateY(5px);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.newhunt b{font:700 clamp(34px,4vw,48px)/1 var(--display)}
.newhunt .plus{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.18);font:700 34px/1 var(--display)}
.continue{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px}
.continue .big{font:700 clamp(40px,5vw,64px)/1 var(--display);font-variant-numeric:tabular-nums}
@media (max-width:600px){.continue{grid-template-columns:auto 1fr}.continue>.cta{grid-column:1/-1}}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
@media (max-width:760px){.quick{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=search],textarea{font:500 14px var(--body);color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:180px;resize:vertical}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}

.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  padding:12px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s,background .15s}
.hrow:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.hrow .n{font:700 22px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.hrow .n small{display:block;font:500 12px var(--body);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
@media (max-width:600px){.hrow{grid-template-columns:auto 1fr auto}.hrow .pill{display:none}}

.empty{text-align:center;padding:42px 20px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:16px}

/* hunt */
.hunt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.hunt{grid-template-columns:1fr}}
.hhead{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.hhead h1{font-size:clamp(30px,3.6vw,44px);letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.screen{position:relative;overflow:hidden;background:var(--screen);color:var(--screen-ink);border-radius:26px;padding:26px 26px 22px;
  border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -60px 120px -60px rgba(108,139,255,.35),0 24px 50px -30px rgba(0,0,0,.6)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.screen .lbl{color:var(--screen-muted);font-weight:600;font-size:14px;position:relative}
.count{position:relative;font:700 clamp(84px,12vw,176px)/.95 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 18px;text-shadow:0 0 40px rgba(108,139,255,.35)}
.count.bump{animation:bump .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.94);text-shadow:0 0 60px rgba(244,194,78,.9)}100%{transform:none}}
.float{position:absolute;font:700 30px var(--display);color:var(--gold);pointer-events:none;animation:floatup .8s ease-out forwards;z-index:3}
:root:not([data-theme="light"]) .float{color:#F4C24E}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.inc{position:relative;width:100%;height:92px;border:0;border-radius:20px;cursor:pointer;background:#6C8BFF;color:#0C1233;
  font:700 30px var(--display);display:flex;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 7px 0 #3B52B8,0 14px 30px -12px rgba(108,139,255,.7);transition:transform .06s,box-shadow .06s}
.inc:active,.inc.press{transform:translateY(5px);box-shadow:0 2px 0 #3B52B8}
.inc:disabled{opacity:.4;cursor:not-allowed}
.inc .kbd{font-size:14px}
.subbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;position:relative}
.subbtns .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);color:var(--screen-ink)}
.subbtns .btn:hover{background:rgba(255,255,255,.13)}
.subbtns .btn.danger{color:#FF8A97}
.chainrow{position:relative;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;margin:-4px 0 18px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05)}
.chainrow b{display:block;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.chainrow span{font-size:12px;color:var(--screen-muted)}
.sessbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.sessbar .clock{font:700 22px var(--display);font-variant-numeric:tabular-nums;margin-right:auto}
.sessbar .clock small{display:block;font:500 12px var(--body);color:var(--muted)}
.odds-big{font:700 38px/1 var(--display);font-variant-numeric:tabular-nums}
.prob{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:var(--raised);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tip{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:700 11px var(--body);cursor:help;background:none;vertical-align:middle}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;right:-8px;top:26px;width:280px;z-index:20;text-align:left;
  background:var(--ink);color:var(--bg);font:500 12.5px/1.45 var(--body);padding:10px 12px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.info dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:12px 0 0;font-size:14px}
.info dt{color:var(--muted)} .info dd{margin:0}
.info .how{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;max-width:62ch}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--body)}
.chart .v{fill:var(--ink);font:600 11px var(--display)}
.sesslist{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13.5px}
.sesslist div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--raised)}

/* wizard / grids */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 20px}
.stepb{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer}
.stepb i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--display);font-style:normal;background:var(--raised)}
.stepb.on{color:var(--ink);border-color:var(--accent)} .stepb.on i{background:var(--accent);color:var(--accent-ink)}
.stepb.done i{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.stepb:disabled{cursor:default;opacity:.55}
.filters{display:grid;grid-template-columns:minmax(200px,2fr) repeat(4,minmax(110px,1fr));gap:8px;margin-bottom:10px}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tog{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--ink)}
.wizgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1000px){.wizgrid{grid-template-columns:1fr}}
.side{position:sticky;top:84px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.pcard{position:relative}
.pc-main{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:border-color .12s,transform .12s}
.pc-main:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pcard.sel .pc-main{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc-main .num{font:600 12px var(--display);color:var(--muted)}
.pc-main .nm{font:700 16px var(--display)}
.pc-main .bl{font-size:12.5px;color:var(--muted);line-height:1.4}
.star{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}
.star.on{color:var(--gold)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.pair>div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:16px;background:var(--raised);font-size:13px;font-weight:600;color:var(--muted)}
.pair>div.sh{background:color-mix(in srgb,var(--gold) 12%,var(--raised))}
.art{width:var(--s);height:var(--s);flex:none;position:relative;display:grid;place-items:center}
.art img{width:100%;height:100%;object-fit:contain}
.art.shiny::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(244,194,78,.35),transparent 70%)}
.hcard .shot .art{position:absolute;left:16px;bottom:-26px}
.guide{align-self:flex-start;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.more{text-align:center;margin-top:18px}
.slot{font-size:11.5px;color:var(--muted);line-height:1.4}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .12s}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile:disabled{cursor:not-allowed;opacity:.5}
.tile b{font:700 17px var(--display)}
.tile .odds{font:600 14px var(--display);color:var(--accent)}
.tile .warn{color:var(--danger);font-size:13px;font-weight:600}
.gen-h{font:600 14px var(--body);color:var(--muted);margin:20px 0 8px}
details summary{cursor:pointer;color:var(--muted);font-weight:600;margin-top:22px}

/* history */
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.hcard{border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.hcard .shot{aspect-ratio:16/9;background:var(--raised) center/cover;display:grid;place-items:center;color:var(--muted);font-size:13px;position:relative}
.hcard .shot .orb{position:absolute;left:16px;bottom:-26px;border:4px solid var(--panel)}
.hcard .body{padding:34px 18px 18px}
.hcard h3{font-size:20px}

/* settings */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow select{width:auto}
.switch{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--raised);cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.keybtn{min-width:86px}
.keybtn.wait{border-color:var(--gold);color:var(--gold)}

/* modal, toast, celebrate */
.scrim{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(6,9,24,.62);backdrop-filter:blur(4px);animation:fade .15s}
.modal{width:min(480px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.modal.wide{width:min(760px,calc(100% - 32px))}
.modal h2{margin-bottom:10px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:toast .25s ease-out}
.toast.ms{background:var(--shiny);color:#2B1C00;font:700 16px var(--display);padding:12px 20px}
.toast.danger{background:var(--danger);color:#fff}
@keyframes toast{from{transform:translateY(12px);opacity:0}}
.celebrate{position:fixed;inset:0;z-index:120;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(244,194,78,.35),rgba(7,9,24,.94) 62%);animation:fade .2s}
.celebrate::before{content:"";position:absolute;inset:0;background:#fff;animation:flash .7s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.celebrate .card{position:relative;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.celebrate h1{font-size:clamp(44px,8vw,86px);background:var(--shiny);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 3s linear infinite}
.celebrate .orb{animation:reveal 1.1s cubic-bezier(.2,.9,.3,1.3)}
.pt{position:absolute;left:50%;top:45%;width:10px;height:10px;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  animation:burst 1.6s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(160deg);opacity:0}}

/* mini overlay */
.mini{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;width:250px;border-radius:20px;overflow:hidden;
  background:var(--screen);color:var(--screen-ink);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px -12px rgba(0,0,0,.65);opacity:var(--op,.96);transform-origin:bottom right}
.mini .grip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 14px;cursor:grab;background:rgba(255,255,255,.05);font-size:12px;color:var(--screen-muted);touch-action:none}
.mini .grip button{background:none;border:0;color:var(--screen-muted);cursor:pointer;font-size:16px;padding:0 4px}
.mini .in{padding:12px 16px 16px;text-align:center}
.mini .nm{font:700 16px var(--display)} .mini .gm{font-size:12px;color:var(--screen-muted)}
.mini .c{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums;margin:10px 0 2px}
.mini .c.bump{animation:bump .28s cubic-bezier(.3,1.6,.5,1)}
.mini .l{font-size:12px;color:var(--screen-muted);margin-bottom:10px}
.mini .inc{height:52px;font-size:20px;border-radius:14px;box-shadow:0 5px 0 #3B52B8}
.mini .inc:active,.mini .inc.press{box-shadow:0 1px 0 #3B52B8;transform:translateY(4px)}
.mini .meta{display:flex;justify-content:space-between;margin-top:12px;font:600 12.5px var(--display);color:var(--screen-muted)}

body.compact main{padding-top:16px} body.compact .panel{padding:14px} body.compact .inc{height:74px}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

const LANG=()=>(S&&S.settings&&S.settings.lang)||'pt';
const LOC=()=>LANG()==='pt'?'pt-PT':'en-US';
function trParts(s,sep,joiner){const parts=s.split(sep);if(parts.length<2)return null;let hit=false;const out=parts.map(p=>{const r=trCore(p);if(r!==null){hit=true;return r}return p});return hit?out.join(joiner):null}
function trExact(k){if(PT[k]!==undefined)return PT[k];for(const[re,f]of PT_RULES){const m=k.match(re);if(m)return f(...m)}return null}
function trCore(k){let r=trExact(k);if(r!==null)return r;
  if(/\.$/.test(k)&&!/\.\.$/.test(k)){r=trExact(k.slice(0,-1));if(r!==null)return r+'.'}
  const i=k.indexOf(', ');if(i>0){const head=k.slice(0,i),tail=k.slice(i+2);const h=trExact(head),t=trCore(tail);if(h!==null||t!==null)return (h??head)+', '+(t??tail)}
  return null}
function tr(str){if(LANG()!=='pt'||typeof str!=='string')return str;const k=str.trim();if(!k||!/[A-Za-z]/.test(k))return str;
  let out=trCore(k);
  if(out===null&&/[.!?]\s+\S/.test(k))out=trParts(k,/(?<=[.!?])\s+/,' ');
  return out===null?str:str.replace(k,out)}
const TR_ATTRS=['placeholder','aria-label','title','data-tip'];
function translateNode(n){if(LANG()!=='pt')return;
  if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest('script,style,textarea,[data-notr]'))return;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;return}
  if(n.nodeType!==1||n.closest('script,style,textarea,[data-notr]'))return;
  const els=[n,...n.querySelectorAll('*')];
  for(const el of els){for(const a of TR_ATTRS){const v=el.getAttribute&&el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t)}}
    if(el.tagName==='SCRIPT'||el.tagName==='STYLE'||el.tagName==='TEXTAREA')continue;
    for(const c of el.childNodes)if(c.nodeType===3){const t=tr(c.nodeValue);if(t!==c.nodeValue)c.nodeValue=t}}}
new MutationObserver(ms=>{if(LANG()!=='pt')return;for(const m of ms)for(const n of m.addedNodes)translateNode(n)}).observe(document.body,{childList:true,subtree:true});

const SP=Object.fromEntries(SPECIES.map(s=>[s.dex,s]));
const GM=Object.fromEntries(GAMES.map(g=>[g.id,g]));
const GENERIC_METHODS=['random','softreset','fishing','masuda'];
function genericEntry(sp,gid,method){const g=GM[gid];
  const odds=method==='masuda'?[['Masuda',g.masuda[0],gid==='black'||gid==='white'||g.gen===4]].concat(g.masuda[1]?[['Masuda with Shiny Charm',g.masuda[1]]]:[])
    :[['Base',g.baseOdds]].concat(g.charm?[['Shiny Charm',g.charm,g.charm===2731]]:[]);
  return{id:'g:'+sp+':'+gid+':'+method,sp,game:gid,method,generic:true,time:'any',weather:'any',locs:[{name:'Not in the guide yet',area:g.region,detail:''}],
    req:'Check that '+SP[sp].name+' can be found in '+g.name+'.',odds,how:'There is no guide entry for this hunt yet. The counter, odds and statistics work normally; guide data is added through data packs.'}}
function entryById(id){if(id&&id.startsWith('g:')){const[,sp,g,m]=id.split(':');return SP[+sp]&&GM[g]&&GM[g].baseOdds&&METHODS[m]&&(m!=='masuda'||GM[g].masuda)?genericEntry(+sp,g,m):null}return AV.find(a=>a.id===id)}
function gameOptions(sp){const s=SP[sp];return GAMES.map(g=>{const es=avFor(sp,g.id),ok=es.filter(huntable);
  const why=!g.baseOdds?'No shinies in Generation '+g.gen:g.gen<s.gen?s.name+' arrived in Generation '+s.gen:'';
  return{g,es,ok,why,guide:!why&&ok.length>0,custom:!why&&!ok.length}})}
function methodOptions(sp,gid){const g=GM[gid],s=SP[sp],es=avFor(sp,gid);if(!g.baseOdds||g.gen<s.gen)return{guide:es,custom:[]};
  const guided=new Set(es.filter(huntable).map(e=>e.method));
  return{guide:es,custom:GENERIC_METHODS.filter(m=>!guided.has(m)&&(m!=='masuda'||g.masuda)).map(m=>genericEntry(sp,gid,m))}}
const allMethods=(sp,gid)=>{const r=methodOptions(sp,gid);return[...r.guide.filter(huntable),...r.custom]};
const avFor=(sp,game)=>AV.filter(a=>a.sp===sp&&(!game||a.game===game));
const huntable=e=>!e.locked&&!e.guaranteed;

const fmt=n=>{try{return Number(n).toLocaleString(LOC(),{useGrouping:'always'})}catch(e){return Number(n).toLocaleString(LOC())}};
const dec=(n,d)=>Number(n).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
const pad=n=>String(n).padStart(2,'0');
const dex3=n=>String(n).padStart(3,'0');
const hms=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const shortDur=ms=>{const m=Math.round(ms/60000);return m<60?m+'m':Math.floor(m/60)+'h '+(m%60)+'m'};

let ART={};
function orb(sp,{shiny=false,size=64}={}){
  const s=SP[sp],sparks=shiny?'<i class="spk a"></i><i class="spk b"></i><i class="spk c"></i>':'',a=ART[sp+(shiny?'s':'')];
  if(a)return `<div class="art ${shiny?'shiny':''}" style="--s:${size}px" aria-hidden="true"><img src="${a}" alt="" loading="lazy" decoding="async">${sparks}</div>`;
  const c1=TYPES[s.types[0]],c2=TYPES[s.types[1]||s.types[0]];
  return `<div class="orb ${shiny?'shiny':''}" style="--s:${size}px;--c1:${c1};--c2:${c2}" aria-hidden="true"><span>${dex3(s.dex)}</span>${sparks}</div>`;
}
const formOf=(sp,i)=>{const f=SP[sp].forms;return f.length?f[Math.min(i||0,f.length-1)]:null};
const typePills=s=>s.types.map(t=>`<span class="type" style="--tc:${TYPES[t]}">${t[0].toUpperCase()+t.slice(1)}</span>`).join(' ');

function mkHunt(entryId,loc=0,odds=0,label){const e=entryById(entryId),m=METHODS[e.method];const now=Date.now();
  return{id:uid(),entry:e.id,sp:e.sp,game:e.game,method:e.method,loc,odds,label:label||m.counter,count:0,chain:0,best:0,status:'active',

function seedSessions(counts,avgSec,startDaysAgo){const now=Date.now();
  return counts.map((c,i)=>{const start=now-(startDaysAgo-i*2)*864e5;const ms=Math.round(c*avgSec*1000*(0.88+((i*37)%25)/100));return{start,end:start+ms,activeMs:ms,count:c}})}
function seed(){return{version:1,settings:defaultSettings(),hunts:[],favorites:[],current:null}}
function seedDemo(){

  const h5=H('280-emerald-random',1847,'completed',seedSessions([520,610,717],14,8),{foundAt:Date.now()-1*864e5});
  return{version:1,settings:defaultSettings(),hunts:[h1,h3,h2,h5,h4],favorites:[133,384,443],current:h1.id};

  if(!S)S=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));lastSaved=Date.now();dirty=false}catch(e){toast('Progress could not be saved: browser storage is full or blocked.','danger')}}

const huntById=id=>S.hunts.find(h=>h.id===id);

const sessMs=h=>h.session?h.session.activeMs+(h.session.runFrom?Date.now()-h.session.runFrom:0):0;
const totalMs=h=>h.sessions.reduce((a,s)=>a+s.activeMs,0)+sessMs(h);
const isClosed=h=>h.status==='completed'||h.status==='abandoned';

/* ========================= counter system ========================= */
function startSession(h){h.session={start:Date.now(),activeMs:0,runFrom:Date.now(),count:0}}
function pauseSession(h){if(h.session&&h.session.runFrom){h.session.activeMs+=Date.now()-h.session.runFrom;h.session.runFrom=null}}
function resumeSession(h){if(h.session&&!h.session.runFrom)h.session.runFrom=Date.now()}
function endSession(h){if(!h.session)return;pauseSession(h);const s=h.session;h.session=null;
  if(s.count>0||s.activeMs>5000)h.sessions.push({start:s.start,end:Date.now(),activeMs:s.activeMs,count:s.count})}
function inc(h,n){
  if(!h||isClosed(h))return;
  let rer=false;if(n>0){if(!h.session){startSession(h);rer=true}else if(!h.session.runFrom){resumeSession(h);rer=true}if(h.status==='paused'){h.status='active';rer=true}}
  const before=h.count;h.count=Math.max(0,h.count+n);const d=h.count-before;if(!d)return;
  if(h.session)h.session.count=Math.max(0,h.session.count+d);
  if(METHODS[h.method].kind==='chain'){h.chain=Math.max(0,h.chain+d);h.best=Math.max(h.best,h.chain)}
  h.updatedAt=Date.now();
  feedback(d);
  MILESTONES.forEach(m=>{if(before<m&&h.count>=m)milestone(m,h)});
  touch();if(rer&&view.name==='hunt'){render();feedback(0)}else refresh();
}
function togglePause(h){if(!h||isClosed(h))return;if(!h.session){startSession(h);toast('Session started')}
  else if(h.session.runFrom){pauseSession(h);toast('Session paused')}else{resumeSession(h);toast('Session resumed')}
  touch();if(view.name==='hunt')render();else refresh()}

/* ========================= feedback, sound, toasts ========================= */
let AC;
function tone(freqs,dur=.05,type='sine',gap=.07,vol=.07){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+i*gap;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03)})}catch(e){}}
function feedback(d){
  if(d)tone(d>0?[1500]:[700],.045,'triangle',0,.05);
  if(!S.settings.anim)return;
  $$('[data-b="count"]').forEach(el=>{el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')});
  $$('.inc').forEach(b=>{b.classList.add('press');setTimeout(()=>b.classList.remove('press'),90)});
  const scr=$('.screen');if(scr&&d>0){const f=document.createElement('span');f.className='float';f.textContent='+'+fmt(d);
    f.style.left=(40+Math.random()*40)+'%';f.style.top='70px';scr.appendChild(f);setTimeout(()=>f.remove(),820)}
}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='ms'?3200:2200)}
function milestone(m,h){tone([660,880,1320],.2,'triangle',.09,.07);toast(fmt(m)+' '+h.label.toLowerCase()+'. Keep going!','ms')}

function celebrate(h){
  tone([988,1319,1568,1976,2637],.4,'sine',.09,.07);
  const s=SP[h.sp],g=GM[h.game];
  const el=document.createElement('div');el.className='celebrate';el.setAttribute('role','dialog');el.setAttribute('aria-label','Shiny found');
  let parts='';if(S.settings.anim){const cols=['#F4C24E','#FFE9A8','#7FE3C4','#B79CFF','#ffffff'];
    for(let i=0;i<56;i++){const a=Math.random()*Math.PI*2,r=180+Math.random()*420;parts+=`<i class="pt" style="--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;background:${cols[i%5]};width:${6+Math.random()*12}px;height:${6+Math.random()*12}px;animation-delay:${Math.random()*.25}s"></i>`}}
  el.innerHTML=parts+`<div class="card">${orb(h.sp,{shiny:true,size:150})}<h1>Shiny found!</h1>
    <p style="font:600 20px var(--display)">${esc(s.name)} in ${esc(g.name)}</p>
    <p class="muted" style="color:#C9CEEA">${fmt(h.count)} ${esc(h.label.toLowerCase())} with ${METHODS[h.method].name}. ${shortDur(totalMs(h))} tracked.</p>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn gold" data-a="go" data-v="history">Open shiny history</button><button class="btn" data-a="cel-close">Close</button></div></div>`;
  document.body.appendChild(el);el.querySelector('[data-a="cel-close"]').focus();
}

function bars(vals,labels){const W=460,H=150,pb=22,max=Math.max(...vals,1),n=vals.length,bw=Math.min(46,(W-20)/n-10);
  const gap=(W-n*bw)/(n+1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${vals.map((v,i)=>{const h=Math.max(2,(H-pb-18)*v/max),x=gap+i*(bw+gap),y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="var(--accent)" opacity="${.55+.45*(i+1)/n}"/><text class="v" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${fmt(v)}</text><text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`}).join('')}</svg>`}

/* live values, updated without re-rendering */
function binds(h){const o=oddsOf(h),p=o[1]>1?cumProb(h.count,o[1]):null;const sm=sessMs(h),tm=totalMs(h);
  const basis=h.session&&h.session.count>=10?[sm,h.session.count]:[tm,h.count];
  return{count:fmt(h.count),label:h.label,labelLower:h.label.toLowerCase(),chain:fmt(h.chain),best:fmt(h.best),
    prob:p===null?'—':pct(p),probbar:p===null?0:p*100,oddsx:o[1]>1?dec(h.count/o[1],2)+'×':'—',
    sess:hms(sm),total:hms(tm),sesscount:fmt(h.session?h.session.count:0),
    avg:basis[1]?dec(basis[0]/basis[1]/1000,1)+' s':'—',rate:basis[0]>60000?fmt(Math.round(basis[1]/(basis[0]/3600000))):'—'}}
function refresh(){
  const since=Math.round((Date.now()-lastSaved)/1000);
  $$('[data-b="saved"]').forEach(el=>el.textContent=tr(dirty&&since>1?'Saving…':since<5?'Saved just now':'Last saved '+(since<60?since+' seconds ago':Math.round(since/60)+' min ago')));
  const scope=[[view.name==='hunt'?huntById(view.arg):cur(),'#main'],[cur(),'#mini-root']];
  scope.forEach(([h,root])=>{if(!h)return;const b=binds(h);$$('[data-b]',$(root)).forEach(el=>{const k=el.dataset.b;if(!(k in b))return;
    const val=typeof b[k]==='string'?tr(b[k]):b[k];if(k==='probbar')el.style.width=val+'%';else if(el.textContent!==String(val))el.textContent=val})});
}
setInterval(refresh,1000);

/* ---------- species grid (shared by wizard & database) ---------- */
const PAGE=120,gridLimit={w:PAGE,d:PAGE};
function filterSpecies(f){const q=f.q.trim().toLowerCase().replace(/^#/,'');
  return SPECIES.filter(s=>{
    if(q){if(/^\d+$/.test(q)){if(!(s.dex===+q||dex3(s.dex).startsWith(q)))return false}
      else if(!(s.name.toLowerCase().includes(q)||s.types.some(t=>t.startsWith(q))))return false}
    if(f.gen&&s.gen!==+f.gen)return false;if(f.type&&!s.types.includes(f.type))return false;if(f.stage!==''&&s.stage!==+f.stage)return false;
    if(f.tags.length&&!f.tags.some(t=>s.tags.includes(t)))return false;
    if(f.fav&&!S.favorites.includes(s.dex))return false;
    if(f.data||f.game||f.method){const av=avFor(s.dex).filter(a=>(!f.game||a.game===f.game)&&(!f.method||a.method===f.method));if(!av.some(huntable))return false}
    return true})}
function filtersHTML(f,ctx){const gens=[1,2,3,4,5,6,7,8,9];
  return `<div class="filters">
   <input type="search" id="${ctx==='w'?'q':'dq'}" data-c="q" data-ctx="${ctx}" value="${esc(f.q)}" placeholder="Search by name, number or type" aria-label="Search Pokémon">
   <select data-c="gen" data-ctx="${ctx}" aria-label="Generation"><option value="">All generations</option>${gens.map(g=>`<option value="${g}" ${+f.gen===g?'selected':''}>Gen ${g}, ${REGIONS[g-1]}</option>`).join('')}</select>
   <select data-c="type" data-ctx="${ctx}" aria-label="Type"><option value="">All types</option>${Object.keys(TYPES).map(t=>`<option value="${t}" ${f.type===t?'selected':''}>${cap(t)}</option>`).join('')}</select>
   <select data-c="game" data-ctx="${ctx}" aria-label="Guide game"><option value="">Guide: any game</option>${GAMES.filter(g=>g.baseOdds).map(g=>`<option value="${g.id}" ${f.game===g.id?'selected':''}>${esc(g.short)}</option>`).join('')}</select>
   <select data-c="method" data-ctx="${ctx}" aria-label="Guide method"><option value="">Guide: any method</option>${Object.entries(METHODS).map(([k,m])=>`<option value="${k}" ${f.method===k?'selected':''}>${m.name}</option>`).join('')}</select></div>
  <div class="tagrow">
   <select data-c="stage" data-ctx="${ctx}" aria-label="Evolution stage" style="width:auto;padding:5px 10px;border-radius:99px"><option value="">Any stage</option>${STAGES.map((s,i)=>`<option value="${i}" ${f.stage!==''&&+f.stage===i?'selected':''}>${s}</option>`).join('')}</select>
   ${Object.entries(TAGS).map(([k,l])=>`<button class="tog" data-a="ftag" data-ctx="${ctx}" data-v="${k}" aria-pressed="${f.tags.includes(k)}">${l}</button>`).join('')}
   <button class="tog" data-a="fbool" data-ctx="${ctx}" data-v="data" aria-pressed="${f.data}">Has a guide</button>
   <button class="tog" data-a="fbool" data-ctx="${ctx}" data-v="fav" aria-pressed="${f.fav}">★ Favorites</button></div>`}
function card(s,ctx){const has=avFor(s.dex).some(huntable),fav=S.favorites.includes(s.dex);
  return `<div class="pcard ${ctx==='w'&&wiz.sp===s.dex?'sel':''}"><button class="pc-main" data-a="${ctx==='w'?'wiz-sp':'dex-open'}" data-v="${s.dex}">
    ${orb(s.dex,{size:58})}<span class="num">#${dex3(s.dex)}</span><span class="nm">${esc(s.name)}</span><span>${typePills(s)}</span>
    <span class="bl">${esc(s.blurb)}${s.tags.length?' '+s.tags.map(t=>TAGS[t]).join(', ')+'.':''}</span>${has?'<span class="guide">Hunting guide</span>':''}</button>
    <button class="star ${fav?'on':''}" data-a="fav" data-v="${s.dex}" aria-label="${fav?'Remove from':'Add to'} favorites" aria-pressed="${fav}">${fav?'★':'☆'}</button></div>`}
function gridHTML(f,ctx){const list=filterSpecies(f);
  if(!list.length)return `<div class="empty"><h3>No Pokémon match these filters</h3><p>Try a shorter search or clear a filter.</p><button class="btn" data-a="fclear" data-ctx="${ctx}">Clear filters</button></div>`;
  const shown=list.slice(0,gridLimit[ctx]);
  return `<p class="muted small" style="margin:-6px 0 10px">${fmt(list.length)} Pokémon</p><div class="grid">${shown.map(s=>card(s,ctx)).join('')}</div>
   ${list.length>shown.length?`<div class="more"><button class="btn" data-a="more" data-ctx="${ctx}">Show more (${fmt(list.length-shown.length)} left)</button></div>`:''}`}
function regrid(ctx,keep){if(!keep)gridLimit[ctx]=PAGE;const el=$('#grid-'+ctx);if(el){el.innerHTML=gridHTML(fOf(ctx),ctx);watchMore()}}
const moreIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const c=e.target.querySelector('[data-a="more"]')?.dataset.ctx;if(c){gridLimit[c]+=PAGE;regrid(c,true)}}}),{rootMargin:'700px'}):null;
function watchMore(){if(!moreIO)return;moreIO.disconnect();$$('.more').forEach(m=>moreIO.observe(m))}

      :`<h3>Pick a Pokémon</h3><p class="muted small" style="margin-top:6px">All ${fmt(SPECIES.length)} Pokémon are here. Search by name, Pokédex number such as 004, or type. The normal and shiny forms appear here side by side.</p>`}</aside></div>`}

    const tile=o=>{const g=o.g;const note=o.guide?o.ok.map(e=>METHODS[e.method].name).join(', '):o.es.length?(o.es[0].guaranteed?'Custom hunt. The guide says it is always shiny here.':'Custom hunt. The guide gift is shiny locked.'):'Custom hunt';

/* ---------- statistics ---------- */
function vStats(){const H=S.hunts,done=H.filter(h=>h.status==='completed');
  const total=H.reduce((a,h)=>a+h.count,0),time=H.reduce((a,h)=>a+totalMs(h),0);
  const byMethod={};H.forEach(h=>byMethod[h.method]=(byMethod[h.method]||0)+h.count);
  const topM=Object.entries(byMethod).sort((a,b)=>b[1]-a[1])[0];
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5);d.setHours(0,0,0,0);days.push(d.getTime())}
  const perDay=days.map(t=>H.reduce((a,h)=>a+h.sessions.filter(s=>s.start>=t&&s.start<t+864e5).reduce((x,s)=>x+s.count,0)+(h.session&&h.session.start>=t&&h.session.start<t+864e5?h.session.count:0),0));
  const top=H.slice().sort((a,b)=>b.count-a.count).slice(0,8);
  return `<h1 style="font-size:34px">Statistics</h1>
  <div class="settings" style="margin-top:18px">
   <div class="panel"><h3>All hunts</h3><dl class="kv" style="margin-top:12px"><dt>Total attempts</dt><dd>${fmt(total)}</dd><dt>Time tracked</dt><dd>${shortDur(time)}</dd><dt>Average per hour</dt><dd>${time>60000?fmt(Math.round(total/(time/36e5))):'—'}</dd>
    <dt>Shinies found</dt><dd>${done.length}</dd><dt>Average attempts per shiny</dt><dd>${done.length?fmt(Math.round(done.reduce((a,h)=>a+h.count,0)/done.length)):'—'}</dd><dt>Most used method</dt><dd>${topM?METHODS[topM[0]].name:'—'}</dd>
    <dt>Sessions</dt><dd>${H.reduce((a,h)=>a+h.sessions.length,0)}</dd></dl></div>
   <div class="panel"><h3>Attempts over the last 14 days</h3>${bars(perDay,days.map(t=>new Date(t).getDate()))}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>Attempts per hunt</h3>${top.length?bars(top.map(h=>h.count),top.map(h=>SP[h.sp].name.slice(0,9))):'<p class="muted small">No hunts yet.</p>'}</div>`}

  const pos=ov.x!==null?`left:${ov.x}px;top:${ov.y}px;right:auto;bottom:auto;`:'';
  root.innerHTML=`<div class="mini" style="${pos}--op:${ov.opacity/100}" role="region" aria-label="Mini counter">
   <div class="grip" id="grip"><span>Mini counter</span><button data-a="mini" aria-label="Close mini counter">×</button></div>
   <div class="in">${ov.showSpecies?`<div class="nm">${esc(SP[h.sp].name)}</div><div class="gm">${esc(GM[h.game].short)}</div>`:''}
    <div class="c" data-b="count">${fmt(h.count)}</div><div class="l" data-b="label">${esc(h.label)}</div>
    <button class="inc" data-a="inc" data-v="1" ${isClosed(h)?'disabled':''}>+1 <span class="kbd">${keyLabel(S.settings.keys.inc)}</span></button>
    ${ov.showOdds||ov.showTimer?`<div class="meta">${ov.showOdds?`<span>${oddsTxt(oddsOf(h))}</span>`:'<span></span>'}${ov.showTimer?`<span data-b="sess">${hms(sessMs(h))}</span>`:''}</div>`:''}</div></div>`;
  const grip=$('#grip'),box=root.firstElementChild;
  grip.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=box.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;grip.setPointerCapture(e.pointerId);
    const mv=ev=>{const x=Math.max(0,Math.min(innerWidth-r.width,ev.clientX-ox)),y=Math.max(0,Math.min(innerHeight-40,ev.clientY-oy));Object.assign(box.style,{left:x+'px',top:y+'px',right:'auto',bottom:'auto'});ov.x=x;ov.y=y};
    const up=()=>{grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);touch()};
    grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up)});

const fOf=ctx=>ctx==='w'?wf:df;
function toggleFav(dex){const i=S.favorites.indexOf(dex);if(i>=0)S.favorites.splice(i,1);else S.favorites.push(dex);touch()}
function startWizardAt(entryId){const e=entryById(entryId);Object.assign(wiz,{step:4,sp:e.sp,game:e.game,entry:e.id,loc:0,odds:0,label:''});closeModal();go('new')}
function createHunt(entryId,loc,odds,label,form){const h=mkHunt(entryId,loc,odds,label);const f=formOf(h.sp,form);if(f)h.form=f.name;S.hunts.unshift(h);S.current=h.id;save();
  Object.assign(wiz,{step:1,sp:null,game:null,entry:null,loc:0,odds:0,label:'',form:0});go('hunt',h.id);
  toast(`Hunt started. Press ${keyLabel(S.settings.keys.inc)} to count.`)}
function download(kind){
  let text;if(kind==='json')text=JSON.stringify({app:'shiny-hunt-counter',exportedAt:new Date().toISOString(),...S},null,2);
  else{const rows=[['id','pokemon','dex','game','method','counter_name','count','status','created','found','time_ms']];
    S.hunts.forEach(h=>rows.push([h.id,SP[h.sp].name,h.sp,GM[h.game].name,METHODS[h.method].name,h.label,h.count,h.status,new Date(h.createdAt).toISOString(),h.foundAt?new Date(h.foundAt).toISOString():'',totalMs(h)]));
    text=rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n')}
  modal('Export '+kind.toUpperCase(),`<p class="muted small" style="margin-bottom:10px">Copy this and keep it somewhere safe. The desktop app saves it straight to a file.</p><textarea id="exp" readonly>${esc(text)}</textarea>`,
   [{label:'Close'},{label:'Copy',cls:'primary',fn:()=>{const t=$('#exp');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Copied'),()=>{document.execCommand&&document.execCommand('copy');toast('Copied')});return false}}],true)}
function doImport(){modal('Import hunts',`<p class="muted small" style="margin-bottom:10px">Paste a JSON export. It replaces the hunts and settings on this device.</p><textarea id="imp" placeholder='{"hunts": [...]}'></textarea>`,
  [{label:'Cancel'},{label:'Import and replace',cls:'primary',fn:()=>{try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.hunts))throw 0;
    const bad=d.hunts.find(h=>!entryById(h.entry));if(bad)throw 0;
    S={version:1,settings:{...defaultSettings(),...d.settings},hunts:d.hunts,favorites:d.favorites||[],current:d.current||d.hunts[0]?.id};save();go('home');toast('Imported '+d.hunts.length+' hunts');}
    catch(e){toast('That file is not a valid export from this app. Check that you pasted the whole JSON.','danger');return false}}}],true)}
function readShot(file,id){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,800/img.width),c=document.createElement('canvas');
  c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);huntById(id).shot=c.toDataURL('image/jpeg',.82);save();render();toast('Screenshot added')};img.src=r.result};r.readAsDataURL(file)}

document.addEventListener('click',e=>{

    case 'sess-start':startSession(h);touch();render();break;

    case 'found':confirmDo('Record your shiny?',`${esc(SP[h.sp].name)} after ${fmt(h.count)} ${esc(h.label.toLowerCase())}. The hunt is marked as completed.`,'Record shiny',()=>{endSession(h);h.status='completed';h.foundAt=Date.now();save();render();celebrate(h)},'gold');break;
    case 'reopen':h.status='active';h.foundAt=null;touch();render();break;
    case 'cel-close':$('.celebrate')?.remove();break;
    case 'rename':modal('Rename counter',`<label class="f">Counter name<input type="text" id="rn" value="${esc(tr(h.label))}" maxlength="28"></label>`,[{label:'Cancel'},{label:'Save name',cls:'primary',fn:()=>{const n=$('#rn').value.trim();if(!n){toast('Enter a name for the counter.','danger');return false}h.label=n;touch();render()}}]);break;
    case 'delhunt':confirmDo('Delete this hunt?',`${esc(SP[h.sp].name)} with ${fmt(h.count)} ${esc(h.label.toLowerCase())} and all its sessions will be removed. This cannot be undone.`,'Delete hunt',()=>{S.hunts=S.hunts.filter(x=>x.id!==h.id);if(S.current===h.id)S.current=S.hunts.find(x=>!isClosed(x))?.id||null;save();go('hunts')},'danger');break;
    case 'mini':S.settings.overlay.on=!S.settings.overlay.on;touch();render();break;
    case 'mini-reset':S.settings.overlay.x=S.settings.overlay.y=null;touch();render();break;
    case 'hfilter':huntFilter=v;render();break;
    case 'ftag':{const f=fOf(ctx),i=f.tags.indexOf(v);i>=0?f.tags.splice(i,1):f.tags.push(v);b.setAttribute('aria-pressed',i<0);regrid(ctx);break}
    case 'fbool':{const f=fOf(ctx);f[v]=!f[v];b.setAttribute('aria-pressed',f[v]);regrid(ctx);break}
    case 'fclear':gridLimit[ctx]=PAGE;Object.assign(fOf(ctx),{q:'',gen:'',type:'',stage:'',tags:[],data:false,fav:false,game:'',method:''});render();break;
    case 'fav':toggleFav(+v);if(view.name==='new'||view.name==='dex')regrid(view.name==='new'?'w':'d');break;
    case 'dex-open':openDex(+v);break;
    case 'hunt-this':startWizardAt(v);break;

    case 'more':gridLimit[ctx]+=PAGE;regrid(ctx,true);break;
    case 'artclear':confirmDo('Remove all artwork?','Your images are removed from this device. The cards go back to placeholder art.','Remove artwork',()=>{artClear()},'danger');break;
    case 'wiz-form':wiz.form=+v;render();break;

    case 'wiz-shiny':{const el=$('#shinyslot .orb');if(el){el.classList.remove('reveal');void el.offsetWidth;el.classList.add('reveal')}tone([1319,1976],.2,'sine',.08,.05);break}
    case 'wiz-step':wiz.step=+v;render();break;
    case 'wiz-game':wiz.game=v;wiz.entry=null;{const ok=allMethods(wiz.sp,v);wiz.step=3;if(ok.length===1){wiz.entry=ok[0].id;wiz.loc=0;wiz.odds=0;wiz.label='';wiz.step=4}}render();break;
    case 'wiz-method':wiz.entry=v;wiz.loc=0;wiz.odds=0;wiz.label='';wiz.step=4;render();break;
    case 'wiz-loc':wiz.loc=+v;render();break;
    case 'wiz-odds':wiz.odds=+v;render();break;
    case 'wiz-start':{const def=tr(METHODS[entryById(wiz.entry).method].counter),l=(wiz.label||'').trim();createHunt(wiz.entry,wiz.loc,wiz.odds,l===def?'':l,wiz.form);break}
    case 'quick-start':createHunt(quick.entry,0,0);Object.assign(quick,{sp:'',game:'',entry:''});break;
    case 'toggle':{const p=v.split('.');let o=S.settings;while(p.length>1)o=o[p.shift()];o[p[0]]=!o[p[0]];touch();render();
      if(v==='globalHotkeys')syncGlobalHotkeys();if(v==='onTop')applyOnTop();break}
    case 'setkey':capturing=capturing===v?null:v;if(capturing)pauseGlobalHotkeys();else syncGlobalHotkeys();render();break;
    case 'export':download(v);break;
    case 'import':doImport();break;
    case 'resetall':confirmDo('Reset all data?','Every hunt, session, shiny record and setting on this device will be deleted. Export first if you want a backup.','Delete everything',()=>{try{localStorage.removeItem(KEY)}catch(e){}S={version:1,settings:defaultSettings(),hunts:[],favorites:[],current:null};save();go('home');toast('All data deleted')},'danger');break;
  }
});
document.addEventListener('input',e=>{const t=e.target,c=t.dataset.c;if(!c)return;
  if(c==='q'){fOf(t.dataset.ctx).q=t.value;regrid(t.dataset.ctx)}

document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;const h=view.name==='hunt'?huntById(view.arg):null;
  if(['gen','type','game','method','stage'].includes(c)){fOf(t.dataset.ctx)[c]=t.value;regrid(t.dataset.ctx)}
  else if(c==='hodds'){h.odds=+t.value;touch();render()}
  else if(c==='hloc'){h.loc=+t.value;touch();render()}

  else if(c==='qentry'){quick.entry=t.value;render()}

  else if(c==='theme'){S.settings.theme=t.value;touch();render()}
  else if(c==='scale'){S.settings.scale=+t.value;touch();render()}

});

/* ========================= hotkey system ========================= */
function handleBinding(name,e){
  if(capturing){e.preventDefault();setTimeout(syncGlobalHotkeys,0);if(name!=='Escape'){const K=S.settings.keys,clash=Object.keys(K).find(k=>K[k]===name&&k!==capturing);if(clash)K[clash]=K[capturing];K[capturing]=name;touch();toast(keyLabel(name)+' assigned')}capturing=null;render();return true}
  const K=S.settings.keys,h=cur();
  if(name===K.inc||name===K.egg){e.preventDefault();if(!h)toast('Open a hunt first, then press '+keyLabel(name)+' to count.');else if(isClosed(h))toast('This hunt is closed. Reopen it to keep counting.');else inc(h,1);return true}
  if(name===K.undo){e.preventDefault();h&&inc(h,-1);return true}
  if(name===K.pause){e.preventDefault();h&&togglePause(h);return true}
  return false}
document.addEventListener('keydown',e=>{
  if(desktopHotkeysOn()&&!capturing)return; // the desktop app handles hotkeys globally
  if(e.key==='Escape'&&!capturing){if($('.celebrate')){$('.celebrate').remove();return}if($('#scrim')){closeModal();return}}
  if(!capturing&&(e.target.matches('input,textarea,select')||$('#scrim')))return;
  if(e.repeat&&!capturing)return;
  handleBinding(e.code,e)});
document.addEventListener('mousedown',e=>{if(e.button<3)return;handleBinding('Mouse'+e.button,e)});
document.addEventListener('mouseup',e=>{if(e.button>=3)e.preventDefault()});

/* ========================= artwork (user-supplied, stored in IndexedDB) ========================= */
const NAME2DEX=Object.fromEntries(SPECIES.map(s=>[s.name.toLowerCase().replace(/♀/,'f').replace(/♂/,'m').replace(/[^a-z0-9]/g,''),s.dex]));
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('shc-art',1);r.onupgradeneeded=()=>r.result.createObjectStore('art');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function artLoad(){try{const db=await idb();const req=db.transaction('art').objectStore('art').openCursor();let n=0;
  req.onsuccess=()=>{const c=req.result;if(c){ART[c.key]=c.value;n++;c.continue()}else if(n)render()}}catch(e){}}
async function artPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('art','readwrite');tx.objectStore('art').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function artClear(){try{const db=await idb();await new Promise(r=>{const tx=db.transaction('art','readwrite');tx.objectStore('art').clear();tx.oncomplete=r;tx.onerror=r})}catch(e){}ART={};render();toast('Artwork removed')}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const k=Math.min(1,256/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/webp',.9))};img.src=r.result};r.readAsDataURL(file)})}
function dexFromPath(path){const base=path.split('/').pop().replace(/\.[a-z0-9]+$/,'');
  const key=base.replace(/shiny/g,'').replace(/-f$/,'f').replace(/-m$/,'m').replace(/[^a-z0-9]/g,'');if(NAME2DEX[key])return NAME2DEX[key];
  const num=base.match(/\d{1,4}/);return num&&SP[+num[0]]?+num[0]:null}
function loadZipLib(){return window.JSZip?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function expandZips(files){const out=[];for(const f of files){if(!/\.zip$/i.test(f.name)){out.push(f);continue}
  try{await loadZipLib();toast('Opening '+f.name+'…');const z=await JSZip.loadAsync(f);
    for(const e of Object.values(z.files)){if(e.dir||!/\.(png|jpe?g|webp|gif)$/i.test(e.name)||/(^|\/)__macosx\//i.test(e.name))continue;
      const blob=await e.async('blob');const file=new File([blob],e.name.split('/').pop(),{type:'image/'+(e.name.split('.').pop().toLowerCase().replace('jpg','jpeg'))});
      Object.defineProperty(file,'webkitRelativePath',{value:e.name});out.push(file)}}
  catch(err){toast('Could not open '+f.name+'. Check that it is a valid .zip file.','danger')}}return out}
async function importArt(files){files=await expandZips(files);files=files.filter(f=>/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif)$/i.test(f.name));
  if(!files.length){toast('No images found. Use PNG, JPG, WebP or GIF files.','danger');return}
  toast('Loading '+fmt(files.length)+' images…');let ok=0,skip=0;
  for(const f of files){const path=(f.webkitRelativePath||f.name).toLowerCase(),dex=dexFromPath(path);if(!dex){skip++;continue}
    try{const k=dex+(/shiny/.test(path)?'s':''),url=await shrink(f);ART[k]=url;await artPut(k,url);ok++}catch(e){skip++}}
  render();toast(fmt(ok)+' image'+(ok===1?'':'s')+' added'+(skip?', '+skip+' skipped because the name did not match a Pokémon':''))}

/* ========================= desktop integration (Tauri) ========================= */
// In the desktop build, window.__TAURI__ exists. In a browser it does not, and all of this is skipped.
const TAURI=window.__TAURI__||null,IS_DESKTOP=!!TAURI;
const desktopHotkeysOn=()=>IS_DESKTOP&&!!TAURI.globalShortcut&&S.settings.globalHotkeys;
let gsQueue=Promise.resolve();
function pauseGlobalHotkeys(){if(!IS_DESKTOP||!TAURI.globalShortcut)return;gsQueue=gsQueue.then(()=>TAURI.globalShortcut.unregisterAll().catch(()=>{}))}
function syncGlobalHotkeys(){if(!IS_DESKTOP||!TAURI.globalShortcut)return;const gs=TAURI.globalShortcut;
  gsQueue=gsQueue.then(async()=>{try{await gs.unregisterAll()}catch(e){}
    if(!S.settings.globalHotkeys)return;const K=S.settings.keys,map={};
    [['inc',1],['egg',1],['undo',-1],['pause',0]].forEach(([k,n])=>{const a=K[k];if(a&&!/^Mouse/.test(a)&&!(a in map))map[a]=n});
    for(const[acc,n]of Object.entries(map)){try{await gs.register(acc,ev=>{if(ev&&ev.state&&ev.state!=='Pressed')return;globalHit(n)})}
      catch(e){toast(keyLabel(acc)+' could not be used as a global hotkey. Another program may already be using it.','danger')}}})}
